name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collab_docs
          POSTGRES_PASSWORD: collab_docs
          POSTGRES_DB: collab_docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collab_docs -d collab_docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # MinIO needs a custom start command, which the `services:` block
      # can't express, so it's run as a plain container step instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          exit 1

      - name: Run migrations
        run: npm run migration:run:prod
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: collab_docs
          POSTGRES_PASSWORD: collab_docs
          POSTGRES_DB: collab_docs

      - name: e2e tests
        run: npm run test:e2e
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: collab_docs
          POSTGRES_PASSWORD: collab_docs
          POSTGRES_DB: collab_docs
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: collab-docs
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:4000
          JWT_ACCESS_SECRET: ci-access-secret-please-do-not-use-in-prod-0000
          JWT_REFRESH_SECRET: ci-refresh-secret-please-do-not-use-in-prod-000
          THROTTLE_REGISTER_LIMIT: "200"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `next build` type-checks the whole project, so it doubles as the
      # typecheck step.
      - run: npm run build
